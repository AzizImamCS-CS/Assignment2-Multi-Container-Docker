events {
    worker_connections 1024;
}

http {
    upstream books_api {
        server books-api:5000;
    }

    upstream staff_api {
        server staff-api:5000;
    }

    upstream readers_api {
        server readers-api:5000;
    }

    server {
        listen 80;

        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        location /api/books {
            proxy_pass http://books_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/staff {
            proxy_pass http://staff_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/readers {
            proxy_pass http://readers_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}